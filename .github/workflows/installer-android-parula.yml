name: Parula Installers for Android

on:
  workflow_dispatch: # manually triggered
    inputs:
      release_type:
        type: choice
        options:
          - prerelease
          - test
        default: 'test'
  push:
    tags: 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Build installers for Android
      uses: actions/setup-node@v6
      with:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: 22.x

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Set NDK to v28
      run:  echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - run: cd app/build; sh parula-brand.sh
    - run: cd app; yarn install
    - run: cd lib; yarn install
    - run: cd desktop/backend; yarn install
    - run: cd mobile; yarn install
    - run: cd mobile/backend; yarn install

    - run: |
        mkdir -p ${{ github.workspace }}/private_keys/
        echo '${{ secrets.KEYSTORE }}' | base64 --decode > ${{ github.workspace }}/private_keys/key.jks

    - run: cd mobile; yarn build:android
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/private_keys/key.jks
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PASS: ${{ secrets.KEYSTORE_ALIAS_PASS }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: parula.apk
        path: |
          mobile/android/app/build/outputs/apk/release/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v7
      with:
        name: parula.aab
        path: |
          mobile/android/app/build/outputs/bundle/release/*.aab

    - name: Set version from package.json
      run: |
        cd mobile
        VERSION=$(jq -r '.version' package.json)
        echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

    - name: Upload to GitHub release
      uses: softprops/action-gh-release@v3
      if: inputs.release_type != 'test'
      with:
        tag_name: ${{ env.APP_VERSION }}
        prerelease: ${{ inputs.release_type == 'prerelease' }}
        make_latest: ${{ inputs.release_type == 'release' }}
        files: |
          mobile/android/app/build/outputs/apk/release/*.apk
          mobile/android/app/build/outputs/bundle/release/*.aab
