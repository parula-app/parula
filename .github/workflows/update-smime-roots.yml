name: Update S/MIME Root Certificates

on:
  schedule:
    - cron: '37 5 11 * *' # monthly, like the NSS releases
  workflow_dispatch: # manually triggered

jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x

    - run: cd app; yarn install
    - name: Generate the roots from the newest NSS release
      run: |
        version=$(git ls-remote --tags --refs https://github.com/mozilla/nss.git 'NSS_3_*_RTM' | sed -E 's|.*refs/tags/NSS_(.*)_RTM$|\1|' | tr _ . | sort -V | tail -1)
        echo "NSS_VERSION=$version" >> "$GITHUB_ENV"
        cd app; yarn run smime:update-roots "NSS_$(echo "$version" | tr . _)_RTM"
    - name: Open a PR if the roots changed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git diff --quiet -I '^#' app/logic/Mail/Encryption/SMIME/roots/; then
          echo "NSS $NSS_VERSION has the same roots"
          exit 0
        fi
        title="S/MIME: Root list: Roots from NSS $NSS_VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -C update-smime-roots
        git commit -m "$title" app/logic/Mail/Encryption/SMIME/roots/
        git push --force origin update-smime-roots
        if [ "$(gh pr view update-smime-roots --json state --jq .state)" = OPEN ]; then
          gh pr edit update-smime-roots --title "$title"
        else
          gh pr create --head update-smime-roots --title "$title" --body "Generated by .github/workflows/update-smime-roots.yml. The diff shows which roots Mozilla added or removed for email. Please check it before merging."
        fi
