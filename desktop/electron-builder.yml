appId: im.mustang.client
productName: Mustang
copyright: Copyright © 2024 Mustang GmbH
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - msi
#    - portable
  executableName: mustang
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
    # Requires CSC_INSTALLER_LINK and CSC_INSTALLER_KEY_PASSWORD secrets on GitHub CI
    # pkg is intentionally arm only
    - target: pkg
  x64ArchFiles: '**/{bufferutil,utf-8-validate}.node'
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    # - snap
    - deb
    - pacman
    - rpm
  maintainer: Mustang
  # <https://specifications.freedesktop.org/menu-spec/latest/additional-category-registry.html>
  category: Network
  icon: build/icon.icns
  mimeTypes:
    - message/rfc822
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  packageName: mustang-mail
  fpm:
    - build/im.mustang.client.metainfo.xml=/usr/share/metainfo/im.mustang.client.metainfo.xml
rpm:
  fpm:
    - build/im.mustang.client.metainfo.xml=/usr/share/metainfo/im.mustang.client.metainfo.xml
pacman:
  fpm:
    - build/im.mustang.client.metainfo.xml=/usr/share/metainfo/im.mustang.client.metainfo.xml
  depends:
    # Only way to remove http-parser (unnecessary and non-existing). electron-builder bug <https://github.com/electron-userland/electron-builder/issues/9429>
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libappindicator-gtk3
protocols:
  name: Send mail
  schemes:
    - mailto
npmRebuild: true
publish:
  - provider: github
    protocol: https
    releaseType: release
    channel: mustang
#  - provider generic
#    url: https://mustang.im/auto-updates
extraMetadata:
  # <https://github.com/electron-userland/electron-builder/issues/6714#issuecomment-2150777424>
  productName: Mustang
fileAssociations:
  ext: eml
  name: E-Mail Message
  description: RFC 822 email message
  role: Viewer
  rank: Default
  mimeType: message/rfc822
